<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>大學光學視光客戶服務</title>
  <!-- LINE LIFF SDK -->
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: "Microsoft JhengHei", -apple-system, BlinkMacSystemFont, sans-serif; background: #eef2ef; display: flex; justify-content: center; align-items: flex-start; padding: 20px; margin: 0; min-height: 100vh; box-sizing: border-box; }
    .card { background: white; padding: 24px; border-radius: 10px; width: 100%; max-width: 420px; box-shadow: 0 4px 16px rgba(0,0,0,0.06); box-sizing: border-box; }
    .header-main { text-align: center; color: #2c3e50; font-size: 21px; font-weight: bold; margin-bottom: 4px; }
    .header-sub { text-align: center; margin-bottom: 18px; border-bottom: 2px solid #94a899; padding-bottom: 8px; }
    #loginArea { display: none; }
    label { font-size: 13px; font-weight: bold; color: #555; display: block; margin-top: 12px; }
    input { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-size: 14.5px; color: #333; background-color: #fafbfc; outline: none; }
    input:focus { border-color: #8bb398; }
    .btn { width: 100%; padding: 12px; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 14.5px; margin-top: 12px; font-weight: bold; text-align: center; display: block; text-decoration: none; box-sizing: border-box; }
    .btn-green { background: #5c8a6b; }
    .btn-gray { background: #94a3b8; display: none; }
    .btn-blue { background: #5b7c99; display: none; }
    .btn-yellow { background: #c2b067; display: none; color: #2b2b2b; }
    #msg { text-align: center; margin-top: 10px; font-weight: bold; min-height: 20px; font-size: 13px; color: #5b7c99; }
    .result-area { display: none; margin-top: 15px; }

    /* 小卡樣式 */
    .kid-card { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 8px; padding: 15px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.03); }
    .kid-card-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #edf2f7; padding-bottom: 8px; margin-bottom: 10px; }
    .kid-name { font-size: 17px; font-weight: bold; color: #2d3748; margin: 0; }
    .prod-badge { font-size: 12px; font-weight: bold; padding: 2px 8px; border-radius: 4px; }
    .badge-ok { background: #edf7ed; color: #1e4620; border: 1px solid #c8e6c9; }
    .badge-defocus-lens { background: #eff6ff; color: #1e40af; border: 1px solid #bfdbfe; }
    .badge-defocus-daily { background: #fdf4ff; color: #86198f; border: 1px solid #f5d0fe; }
    .badge-glasses { background: #f8fafc; color: #334155; border: 1px solid #cbd5e1; }
    .badge-rgp { background: #fff7ed; color: #9a3412; border: 1px solid #ffedd5; }

    .item { margin-bottom: 7px; font-size: 13px; }
    .t { font-size: 11.5px; color: #64748b; margin-bottom: 1px; }
    .v { font-size: 14px; font-weight: 600; color: #1e293b; }
    .flex-row { display: flex; gap: 8px; margin-top: 7px; }
    .box { flex: 1; background: #f8fafc; padding: 8px 10px; border-radius: 5px; border-left: 3px solid #94a3b8; font-size: 12.5px; box-sizing: border-box; }
    .box-green { border-left-color: #5c8a6b; background: #f4fbf6; }
    .box-blue { border-left-color: #3b82f6; background: #f0f7ff; }

    /* 衛教提示區塊 */
    .edu-box { margin-top: 10px; font-size: 12px; line-height: 1.5; color: #475569; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 5px; padding: 8px 10px; }

    /* 點擊放大照片 */
    .lens-img-clickable { width: 100%; max-height: 120px; object-fit: contain; border-radius: 4px; margin-top: 4px; cursor: pointer; border: 1px solid #cbd5e1; background: #fff; }
    #imageModal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.88); z-index: 10000; justify-content: center; align-items: center; padding: 15px; box-sizing: border-box; }
    #imageModal img { max-width: 95%; max-height: 85vh; border-radius: 6px; object-fit: contain; }
    #imageModal .close-btn { position: absolute; top: 18px; right: 22px; color: white; font-size: 30px; font-weight: bold; cursor: pointer; user-select: none; }

    /* 讀取遮罩 */
    #loadingOverlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(253, 251, 249, 0.96); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 9999; }
    .glasses-loader { display: flex; align-items: center; justify-content: center; margin-bottom: 15px; }
    .lens { width: 36px; height: 36px; border: 3.5px solid #6d5c53; border-radius: 50%; background: rgba(156, 168, 158, 0.15); }
    .bridge { width: 14px; height: 3.5px; background: #6d5c53; margin: 0 -2px; }
    .loading-text { color: #6d5c53; font-size: 14px; font-weight: bold; }
    .warning-text { font-size: 11px; font-weight: normal; color: #94a3b8; text-align: center; margin-top: 18px; line-height: 1.4; display: none; }
  </style>
</head>
<body>

  <div id="loadingOverlay">
    <div class="glasses-loader">
      <div class="lens"></div>
      <div class="bridge"></div>
      <div class="lens"></div>
    </div>
    <div class="loading-text" id="overlayText">視光資料載入中...</div>
  </div>
  <!-- 點擊放大檢視照片彈窗 -->
  <div id="imageModal" onclick="closeImageModal()">
    <span class="close-btn">&times;</span>
    <img id="modalImg" src="" alt="放大照片" onclick="event.stopPropagation()">
  </div>

  <div class="card">
    <div class="header-main">視光客戶紀錄</div>
    <div class="header-sub">
      <span style="color: #6b8c9e; font-size: 13px;">資料即時同步更新</span>
    </div>
    <div id="msg">連線系統中...</div>

    <div id="loginArea">
      <label>小朋友姓名</label>
      <input type="text" id="inB" placeholder="請輸入小朋友姓名" maxlength="20">
      
      <label>留存家長手機</label>
      <input type="text" id="inC" placeholder="請輸入 10 碼手機號碼 (如 0912345678)" inputmode="tel" maxlength="10">
      
      <label>生日 (民國年月日共7碼)</label>
      <input type="number" id="inBirthday" placeholder="例：1010119" inputmode="numeric">
      <div style="font-size: 11.5px; color: #c06c6c; margin-top: 4px; font-weight: bold;">* 民國101年1月19日 請填 1010119</div>
      
      <button class="btn btn-green" id="submitBtn" onclick="doBindAndVerify()">確認綁定查詢</button>
      <button class="btn btn-gray" id="cancelBtn" onclick="cancelAdd()">返回資料清單</button>
    </div>

    <div id="resArea" class="result-area"></div>
    <div id="warningMsg" class="warning-text">此服務系統為大學桃園南崁獨家系統，本服務開發者有權隨時終止服務且不另行通知。</div>

    <a href="https://line.me/R/ti/p/@rjm4151u" target="_blank" id="linkBtn" class="btn btn-yellow">點此預約門市回診</a>
    <button id="addKidBtn" class="btn btn-blue" onclick="showAddForm()">➕ 綁定其他配戴者</button>
  </div>

  <script>
    const MY_LIFF_ID = "2008915202-hWkjhM3j"; 
    const SUPABASE_URL = "https://wycoyydhcaeuabaelwdo.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Ind5Y295eWRoY2FldWFiYWVsd2RvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc5MDk2MDUsImV4cCI6MjEwMzQ4NTYwNX0.fkTge9-CHTIIYhQOfMpEmkRM9vOleM6rGd-h4sYDzjw";
    
    let supabaseClient = null;
    let currentUid = "";
    let currentLiffName = ""; 
    let currentLiffPic = "";  
    let productConfigMap = {};

    function showOverlay(text) {
      const overlay = document.getElementById('loadingOverlay');
      if (text) document.getElementById('overlayText').innerText = text;
      overlay.style.display = 'flex';
    }

    function hideOverlay() {
      document.getElementById('loadingOverlay').style.display = 'none';
    }

    function openImageModal(url) {
      const modal = document.getElementById('imageModal');
      const img = document.getElementById('modalImg');
      img.src = url;
      modal.style.display = 'flex';
    }

    function closeImageModal() {
      const modal = document.getElementById('imageModal');
      modal.style.display = 'none';
      document.getElementById('modalImg').src = '';
    }

    window.onload = async function() {
      showOverlay("讀取個人視光資料中...");
      
      if (window.supabase && window.supabase.createClient) {
        supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      }

      await loadGlobalConfig();

      try {
        await liff.init({ liffId: MY_LIFF_ID });
        if (liff.isLoggedIn()) {
          const profile = await liff.getProfile();
          currentUid = profile.userId;
          currentLiffName = profile.displayName; 
          currentLiffPic = profile.pictureUrl;

          // ★ 新增：家長一開啟 LIFF，自動將最新暱稱與大頭照同步/更新至雲端資料庫
          if (supabaseClient && currentUid) {
            supabaseClient
              .from('line_profiles')
              .upsert({
                uid: currentUid,
                display_name: currentLiffName || '',
                picture_url: currentLiffPic || '',
                updated_at: new Date().toISOString()
              }, { onConflict: 'uid' })
              .then(({ error }) => {
                if (error) console.warn("同步個人 LINE 資訊失敗:", error);
              });
          }

          await fetchKidsByUID(currentUid);
        } else {
          hideOverlay();
          showMsg("請在 LINE 內開啟以啟用個人服務");
        }
      } catch (err) {
        hideOverlay();
        showErr("系統初始化失敗：" + err);
      }
    };

    async function loadGlobalConfig() {
      try {
        if (supabaseClient) {
          const { data } = await supabaseClient
            .from('system_settings')
            .select('data')
            .eq('id', 'global_config')
            .maybeSingle();

          if (data && data.data && data.data.productConfigMap) {
            productConfigMap = data.data.productConfigMap;
          }
        }
      } catch (e) {
        console.warn("載入設定略過:", e);
      }
    }

    async function fetchKidsByUID(uid) {
      try {
        const { data, error } = await supabaseClient
          .from('customers')
          .select('*')
          .contains('line_uids', [uid]);

        hideOverlay();
        if (!error && data && data.length > 0) {
          renderData(data);
        } else {
          document.getElementById('cancelBtn').style.display = "none";
          showMsg("歡迎！請輸入小朋友資料完成初次建檔綁定。");
        }
      } catch (err) {
        hideOverlay();
        showErr("資料讀取失敗：" + err.message);
      }
    }

    async function doBindAndVerify() {
      const name = document.getElementById('inB').value.trim();
      const phone = document.getElementById('inC').value.trim();
      const birthdayRaw = document.getElementById('inBirthday').value.trim();

      if (!name || !phone || !birthdayRaw) return showErr("請填寫完整姓名、手機號碼與生日");
      if (!/^\d{10}$/.test(phone)) return showErr("手機格式錯誤！請輸入 10 碼數字 (例：0912345678)");
      if (!/^\d{7}$/.test(birthdayRaw)) return showErr("生日格式錯誤！請輸入民國共7碼 (例：1010119)");

      const bY = parseInt(birthdayRaw.substring(0, 3), 10);
      const bM = birthdayRaw.substring(3, 5);
      const bD = birthdayRaw.substring(5, 7);
      const formattedBirthday = `${bY}/${bM}/${bD}`;

      showOverlay("資料配對與綁定中...");

      const sendChatMessage = async (statusText, extraNote = "") => {
        if (liff.isInClient()) {
          try {
            let msgText = `【門市服務資料建檔確認】\n姓名：${name}\n電話：${phone}\n生日：${formattedBirthday}\n狀態：${statusText}`;
            if (extraNote) {
              msgText += `\n備註：${extraNote}`;
            }
            await liff.sendMessages([{
              type: "text",
              text: msgText
            }]);
          } catch (err) {
            console.warn("聊天室訊息發送失敗:", err);
          }
        }
      };

      try {
        const { data, error } = await supabaseClient
          .from('customers')
          .select('*')
          .ilike('name', name);

        if (error) throw error;

        const matched = (data || []).find(c => {
          const cPhone = (c.phone || '').replace(/[^\d]/g, '');
          const matchP = cPhone && cPhone.includes(phone);
          const matchB = c.birthday && (c.birthday.includes(formattedBirthday) || c.birthday.replace(/\//g,'').includes(birthdayRaw));
          return matchP || matchB;
        });

        if (matched) {
          let uids = matched.line_uids || [];
          if (!Array.isArray(uids)) uids = [];
          if (!uids.includes(currentUid)) {
            uids.push(currentUid);
            await supabaseClient
              .from('customers')
              .update({ line_uids: uids })
              .eq('code', matched.code);
          }

          await sendChatMessage("已完成線上配對綁定");
          hideOverlay();
          alert(`綁定成功！已為您關聯【${matched.name}】的視光追蹤紀錄。`);
          await fetchKidsByUID(currentUid);
        } else {
          const { data: existPending } = await supabaseClient
            .from('unbound_requests')
            .select('id')
            .eq('uid', currentUid)
            .eq('name', name)
            .eq('status', 'pending');

          hideOverlay();

          if (existPending && existPending.length > 0) {
            showErr("您的建檔申請門市正在為您核對中，請勿重複送出！");
            return;
          }

          await supabaseClient
            .from('unbound_requests')
            .insert([{
              name: name,
              phone: phone,
              birthday: formattedBirthday,
              uid: currentUid,
              liff_name: currentLiffName,
              liff_pic: currentLiffPic,
              status: 'pending'
            }]);

          await sendChatMessage("已送出申請", "資料待門市專人核對");
          showErr("門市尚未比對到此紀錄。已為您送出申請，門市專人將於 1-2 工作日內核對綁定！");
        }
      } catch (err) {
        hideOverlay();
        showErr("連線失敗：" + err.message);
      }
    }

    function maskNameText(name) {
      if (!name) return "-";
      name = name.trim();
      if (name.length === 1) return name;
      if (name.length === 2) return name.charAt(0) + "O";
      return name.charAt(0) + "O".repeat(name.length - 2) + name.slice(-1);
    }

    function showAddForm() {
      document.getElementById('resArea').style.display = "none";
      document.getElementById('linkBtn').style.display = "none";
      document.getElementById('addKidBtn').style.display = "none";
      document.getElementById('cancelBtn').style.display = "block";
      document.getElementById('msg').innerText = "請輸入另一位小朋友資料";
      document.getElementById('loginArea').style.display = "block";
    }

    function cancelAdd() {
      document.getElementById('loginArea').style.display = "none";
      document.getElementById('resArea').style.display = "block";
      document.getElementById('linkBtn').style.display = "block";
      document.getElementById('addKidBtn').style.display = "block";
      document.getElementById('msg').innerText = "";
    }

    function showMsg(text) {
      document.getElementById('msg').style.color = "#555";
      document.getElementById('msg').innerText = text;
      document.getElementById('loginArea').style.display = "block";
    }

    function showErr(text) {
      document.getElementById('msg').style.color = "#c06c6c";
      document.getElementById('msg').innerText = text;
    }

    // 輔助函式：十六進位色碼轉為帶有透明度的 RGBA 背景
    function hexToRgba(hex, alpha = 0.08) {
      if (!hex || !hex.startsWith('#') || hex.length < 7) return 'rgba(92, 138, 107, 0.08)';
      const r = parseInt(hex.slice(1, 3), 16);
      const g = parseInt(hex.slice(3, 5), 16);
      const b = parseInt(hex.slice(5, 7), 16);
      return `rgba(${r}, ${g}, ${b}, ${alpha})`;
    }

    function renderData(dataArray) {
      document.getElementById('msg').style.color = "#5c8a6b";
      document.getElementById('msg').innerText = "已為您載入視光管理紀錄";
      document.getElementById('loginArea').style.display = "none";
      
      const area = document.getElementById('resArea');
      let html = "";

      dataArray.forEach(function(item) {
        const rawProduct = (item.product || "").trim();
        const conf = productConfigMap[rawProduct] || {};
        
        const displayProductName = conf.displayName || rawProduct || "視光方案";
        
        let cardType = conf.cardType;
        if (!cardType) {
          if (rawProduct.includes('離焦大片') || rawProduct.includes('離焦眼鏡') || rawProduct.includes('HOYA')) {
            cardType = 'defocus_lens';
          } else if (rawProduct.includes('日拋') || rawProduct.includes('酷柏')) {
            cardType = 'defocus_daily';
          } else if (rawProduct.includes('RGP') || rawProduct.includes('硬式')) {
            cardType = 'rgp';
          } else if (rawProduct.includes('眼鏡')) {
            cardType = 'glasses';
          } else {
            cardType = 'ok';
          }
        }

        // 讀取後台設定的動態開關
        const isRecordPhoto = conf.isRecordPhoto !== undefined ? conf.isRecordPhoto : (cardType === 'glasses');
        const showLongRemark = conf.showLongRemark !== undefined ? conf.showLongRemark : (cardType === 'glasses' || cardType === 'rgp');

        const badgeCol = conf.badgeColor || '#5c8a6b';
        const odCol = conf.odColor || '#5c8a6b';
        const osCol = conf.osColor || '#3b82f6';

        const badgeStyle = `background: ${hexToRgba(badgeCol, 0.12)}; color: ${badgeCol}; border: 1px solid ${hexToRgba(badgeCol, 0.35)};`;
        const odBoxStyle = `background: ${hexToRgba(odCol, 0.06)}; border-left: 3.5px solid ${odCol};`;
        const osBoxStyle = `background: ${hexToRgba(osCol, 0.06)}; border-left: 3.5px solid ${osCol};`;

        // 1. 眼軸長度區塊 (AL) ★ 嚴格條件：必須有明確 AL 檢查日且有測量值才顯示
        const hasValidAlDate = item.alCheckDate && item.alCheckDate.trim() !== '' && item.alCheckDate.trim() !== '-';
        const hasAlValue = (item.alOD && item.alOD.trim() !== '' && item.alOD.trim() !== '-') || (item.alOS && item.alOS.trim() !== '' && item.alOS.trim() !== '-');

        const alHtml = (hasValidAlDate && hasAlValue) ? `
          <div class="flex-row" style="margin-top:6px;">
            <div class="box"><div class="t">AL 右眼軸長 (${item.alCheckDate})</div><div class="v">${item.alOD || "-"} mm</div></div>
            <div class="box"><div class="t">AL 左眼軸長 (${item.alCheckDate})</div><div class="v">${item.alOS || "-"} mm</div></div>
          </div>` : '';

        // 2. 照片渲染邏輯 (★ 支援動態切換：雙眼照 OR 紀錄照1與紀錄照2)
        let photoHtml = "";
        const photo1 = item.od_lens_photo;
        const photo2 = item.os_lens_photo;

        if (photo1 || photo2) {
          if (isRecordPhoto) {
            // ★ 紀錄照模式：顯示「紀錄照1」與「紀錄照2」
            if (photo1 && photo2) {
              photoHtml = `
                <div class="flex-row" style="margin-top:8px;">
                  <div class="box" style="text-align:center;"><div class="t">紀錄照 1 (點擊放大)</div><img src="${photo1}" class="lens-img-clickable" onclick="openImageModal('${photo1}')"></div>
                  <div class="box" style="text-align:center;"><div class="t">紀錄照 2 (點擊放大)</div><img src="${photo2}" class="lens-img-clickable" onclick="openImageModal('${photo2}')"></div>
                </div>`;
            } else {
              const singleSrc = photo1 || photo2;
              photoHtml = `
                <div style="margin-top:8px;">
                  <div class="box" style="text-align:center;">
                    <div class="t">紀錄照 (點擊放大)</div>
                    <img src="${singleSrc}" class="lens-img-clickable" onclick="openImageModal('${singleSrc}')">
                  </div>
                </div>`;
            }
          } else {
            // ★ 標準雙眼醫療模式：顯示「右眼照 (OD)」與「左眼照 (OS)」
            if (photo1 && photo2) {
              photoHtml = `
                <div class="flex-row" style="margin-top:8px;">
                  <div class="box" style="text-align:center;"><div class="t">右眼照 OD (點擊放大)</div><img src="${photo1}" class="lens-img-clickable" onclick="openImageModal('${photo1}')"></div>
                  <div class="box" style="text-align:center;"><div class="t">左眼照 OS (點擊放大)</div><img src="${photo2}" class="lens-img-clickable" onclick="openImageModal('${photo2}')"></div>
                </div>`;
            } else if (photo1) {
              photoHtml = `
                <div style="margin-top:8px;">
                  <div class="box" style="text-align:center;"><div class="t">右眼照 OD (點擊放大)</div><img src="${photo1}" class="lens-img-clickable" onclick="openImageModal('${photo1}')"></div>
                </div>`;
            } else if (photo2) {
              photoHtml = `
                <div style="margin-top:8px;">
                  <div class="box" style="text-align:center;"><div class="t">左眼照 OS (點擊放大)</div><img src="${photo2}" class="lens-img-clickable" onclick="openImageModal('${photo2}')"></div>
                </div>`;
            }
          }
        }

        // 3. 長期備註區塊 (★ 由後台勾選開關決定是否顯示)
        const remarkHtml = (showLongRemark && item.longRemark) ? `
          <div class="item" style="margin-top:7px;">
            <div class="t">備註說明</div>
            <div class="v" style="font-weight:500; font-size:13.5px; color:#334155; background:#f8fafc; padding:6px 8px; border-radius:4px; border:1px solid #e2e8f0; margin-top:2px;">${item.longRemark}</div>
          </div>` : '';

        // 4. 動態組合卡片內容
        let cardBodyHTML = "";

        if (cardType === 'ok') {
          cardBodyHTML = `
            <div class="item"><div class="t">最近回診檢查日</div><div class="v">${item.lastVisit || "-"}</div></div>
            <div class="item"><div class="t">未回診天數</div><div class="v">${item.overdueDays ? item.overdueDays + ' 天' : "-"}</div></div>
            <div class="flex-row">
              <div class="box" style="${odBoxStyle}"><div class="t">右眼(OD)使用時間</div><div class="v">${item.odDuration || "-"}</div></div>
              <div class="box" style="${osBoxStyle}"><div class="t">左眼(OS)使用時間</div><div class="v">${item.osDuration || "-"}</div></div>
            </div>
            ${alHtml}
            ${photoHtml}
            ${remarkHtml}
            <div class="edu-box" style="color: #991b1b; background: #fff5f5; border-color: #fed7d7;">
              【提醒：OK鏡片建議 1.5 ~ 2 年定期更換】<br>
              若不適請停止使用並就醫，正確用眼才不會讓效果會打折。
            </div>
          `;
        } else if (cardType === 'defocus_lens') {
          cardBodyHTML = `
            <div class="item"><div class="t">最近回診檢查日</div><div class="v">${item.lastVisit || "-"}</div></div>
            <div class="item"><div class="t">未回診天數</div><div class="v">${item.overdueDays ? item.overdueDays + ' 天' : "-"}</div></div>
            <div class="flex-row">
              <div class="box" style="${odBoxStyle}"><div class="t">右眼(OD)鏡片時間</div><div class="v">${item.odDuration || "-"}</div></div>
              <div class="box" style="${osBoxStyle}"><div class="t">左眼(OS)鏡片時間</div><div class="v">${item.osDuration || "-"}</div></div>
            </div>
            ${item.serviceDate ? `<div class="item" style="margin-top:7px;"><div class="t">售服日期</div><div class="v">${item.serviceDate}</div></div>` : ''}
            ${alHtml}
            ${photoHtml}
            ${remarkHtml}
            <div class="edu-box">
              眼鏡需每日以冷水與中性洗碗精清洗並擦乾，正確用眼才不會讓效果會打折。
            </div>
          `;
        } else if (cardType === 'defocus_daily') {
          cardBodyHTML = `
            <div class="item"><div class="t">最近回診檢查日</div><div class="v">${item.lastVisit || "-"}</div></div>
            <div class="item"><div class="t">未回診天數</div><div class="v">${item.overdueDays ? item.overdueDays + ' 天' : "-"}</div></div>
            <div class="flex-row">
              <div class="box" style="${odBoxStyle}"><div class="t">右眼(OD)取件時間</div><div class="v">${item.odChangeDate || "-"}</div></div>
              <div class="box" style="${osBoxStyle}"><div class="t">左眼(OS)取件時間</div><div class="v">${item.osChangeDate || "-"}</div></div>
            </div>
            ${alHtml}
            ${photoHtml}
            ${remarkHtml}
            <div class="edu-box">
              日拋需每日拋棄不可重複配戴，若不適請停止使用並就醫，正確用眼才不會讓效果會打折。
            </div>
          `;
        } else if (cardType === 'glasses') {
          cardBodyHTML = `
            <div class="flex-row">
              <div class="box" style="${odBoxStyle}"><div class="t">右眼(OD)取件時間</div><div class="v">${item.odChangeDate || "-"}</div></div>
              <div class="box" style="${osBoxStyle}"><div class="t">左眼(OS)取件時間</div><div class="v">${item.osChangeDate || "-"}</div></div>
            </div>
            ${alHtml}
            ${photoHtml}
            ${remarkHtml}
          `;
        } else if (cardType === 'rgp') {
          cardBodyHTML = `
            <div class="flex-row">
              <div class="box" style="${odBoxStyle}"><div class="t">右眼(OD)取件時間</div><div class="v">${item.odChangeDate || "-"}</div></div>
              <div class="box" style="${osBoxStyle}"><div class="t">左眼(OS)取件時間</div><div class="v">${item.osChangeDate || "-"}</div></div>
            </div>
            ${alHtml}
            ${photoHtml}
            ${remarkHtml}
          `;
        }

        html += `
          <div class="kid-card">
            <div class="kid-card-header">
              <div class="kid-name">${maskNameText(item.name)}</div>
              <div class="prod-badge" style="${badgeStyle}">${displayProductName}</div>
            </div>
            ${cardBodyHTML}
          </div>
        `;
      });

      area.innerHTML = html;
      area.style.display = "block";
      document.getElementById('warningMsg').style.display = "block";
      document.getElementById('linkBtn').style.display = "block";
      document.getElementById('addKidBtn').style.display = "block";
    }
  </script>
</body>
</html>
